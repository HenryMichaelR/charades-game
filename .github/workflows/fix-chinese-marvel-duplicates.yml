name: Fix Chinese Marvel duplicates

on:
  push:
    paths:
      - ".github/workflows/fix-chinese-marvel-duplicates.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix Chinese Marvel duplicate variants
        run: python .github/scripts/fix_chinese_marvel_duplicates.py

      - name: Validate words.js
        run: node --check words.js

      - name: Commit final cleanup
        run: |
          rm -f .github/scripts/fix_chinese_marvel_duplicates.py
          rm -f .github/workflows/fix-chinese-marvel-duplicates.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align simplified Chinese Marvel names"
          git push
