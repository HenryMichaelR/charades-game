name: Rebuild familiar Animals category

on:
  push:
    paths:
      - ".github/workflows/rebuild-animals.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace Animals word bank
        run: python .github/scripts/rebuild_animals.py

      - name: Validate Animals category
        run: |
          node --check words.js
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path("words.js").read_text(encoding="utf-8")
          payload = text.split("window.CHARADES_CATEGORIES = ", 1)[1].strip()
          categories = json.loads(payload[:-1])
          animals = categories["Animals"]
          normalized = [re.sub(r"[^a-z0-9]+", "", animal.casefold()) for animal in animals]

          assert len(animals) == 150, len(animals)
          assert len(normalized) == len(set(normalized))

          required = [
              "Dog", "Cat", "Lion", "Tiger", "Elephant", "Panda",
              "Penguin", "Dolphin", "Shark", "Octopus", "Butterfly",
              "Kangaroo", "Giraffe", "Monkey", "Crocodile"
          ]
          for animal in required:
              assert animal in animals, animal

          removed_specific = [
              "Affenpinscher", "African Palm Civet", "Alpine Dachsbracke",
              "Chinstrap Penguin", "Monte Iberia Eleuth", "Pied Tamarin",
              "Epagneul Pont Audemer", "Grey Mouse Lemur"
          ]
          for animal in removed_specific:
              assert animal not in animals, animal

          print("Validated 150 familiar Animals entries")
          PY

      - name: Commit final Animals category
        run: |
          rm -f .github/scripts/rebuild_animals.py
          rm -f .github/workflows/rebuild-animals.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Animals list with familiar names"
          git push
