name: Apply two-gesture motion fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-two-gesture.yml
      - .github/scripts/apply_two_gesture.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace motion detector
        run: python .github/scripts/apply_two_gesture.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          script = text.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/charades.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/charades.js

      - name: Commit the fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_two_gesture.py
          git rm .github/workflows/apply-two-gesture.yml
          git add index.html
          git commit -m "Use separate Correct and Skip gesture calibration"
          git push
