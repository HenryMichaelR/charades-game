name: Clean expanded word banks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clean-large-word-banks.yml
      - .github/scripts/clean_large_word_banks_v2.py

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Rebuild and clean the large banks
        run: python .github/scripts/clean_large_word_banks_v2.py

      - name: Validate all banks
        shell: bash
        run: |
          node --check words.js
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('words.js', 'utf8'), context);
          const banks = context.window.CHARADES_CATEGORIES;
          const expected = ['Animals', 'Movies', 'Video Games', 'Marvel', 'Disney'];
          if (JSON.stringify(Object.keys(banks)) !== JSON.stringify(expected)) {
            throw new Error('Category order changed');
          }
          for (const [name, words] of Object.entries(banks)) {
            if (words.length !== 500) throw new Error(`${name}: ${words.length}`);
            const normalized = words.map(word => word.toLowerCase().replace(/[^a-z0-9]+/g, ''));
            if (new Set(normalized).size !== 500) throw new Error(`${name}: duplicates`);
          }
          if (banks.Marvel.some(name => /in other media|gallery|category:|list of |\//i.test(name))) {
            throw new Error('Marvel contains non-character pages');
          }
          if (banks.Disney.some(name => /gallery|category:|list of |\//i.test(name))) {
            throw new Error('Disney contains index/gallery pages');
          }
          console.log(Object.fromEntries(Object.entries(banks).map(([k,v]) => [k,v.length])));
          console.log('Top games:', banks['Video Games'].slice(30, 45));
          console.log('Marvel sample:', banks.Marvel.slice(30, 45));
          console.log('Disney sample:', banks.Disney.slice(30, 45));
          JS

      - name: Commit cleaned banks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/clean_large_word_banks.py
          rm -f .github/scripts/clean_large_word_banks_v2.py
          rm -f .github/workflows/clean-large-word-banks.yml
          git add -A
          git commit -m "Clean and rebalance expanded word banks"
          git push
