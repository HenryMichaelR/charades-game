name: Remove computer test and pause timer in portrait

on:
  push:
    paths:
      - ".github/workflows/remove-test-and-pause-timer.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply game updates
        run: python .github/scripts/remove-test-and-pause-timer.py

      - name: Validate updated game
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")

          forbidden = [
              "Test on Computer",
              "startTestGame",
              "testControls",
              "testMode",
              "timerEndTimeout",
          ]
          for item in forbidden:
              assert item not in text, item

          required = [
              "let timerRemainingMs = 0;",
              "let timerLastTickAt = null;",
              "let timerPausedForOrientation = false;",
              "function roundTimerCanRun()",
              "function drawRoundTimer(timestamp)",
              "(!motionEnabled || isPhoneLandscape())",
              "timerPausedForOrientation = true;",
              "timerLastTickAt = null;",
              "beginCountdown();",
          ]
          for item in required:
              assert item in text, item

          scripts = re.findall(r"<script(?:[^>]*)>(.*?)</script>", text, flags=re.S)
          inline_scripts = [script for script in scripts if script.strip()]
          assert inline_scripts, "No inline JavaScript found"
          Path("/tmp/charades-inline.js").write_text(
              "\n".join(inline_scripts),
              encoding="utf-8",
          )

          print("Validated removal of test mode and true portrait timer pause")
          PY
          node --check /tmp/charades-inline.js

      - name: Commit final update
        run: |
          rm -f .github/scripts/remove-test-and-pause-timer.py
          rm -f .github/workflows/remove-test-and-pause-timer.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove computer test and pause timer in portrait"
          git push
