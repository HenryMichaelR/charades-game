name: Add Chinese Movies Category

on:
  push:
    paths:
      - '.github/workflows/add-chinese-movies.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add 华语电影 category
        run: python .github/scripts/add_chinese_movies.py

      - name: Validate words.js
        run: node --check words.js

      - name: Commit final category
        run: |
          rm -f .github/scripts/add_chinese_movies.py
          rm -f .github/workflows/add-chinese-movies.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add 华语电影 category"
          git push
