name: Add Mainland Chinese Marvel and Disney categories

on:
  push:
    paths:
      - ".github/workflows/add-chinese-marvel-disney.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add translated categories
        run: python .github/scripts/add_chinese_marvel_disney.py

      - name: Validate word bank JavaScript
        run: node --check words.js

      - name: Validate translated categories
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          text = Path('words.js').read_text(encoding='utf-8')
          prefix = 'window.CHARADES_CATEGORIES = '
          assert text.startswith('// Generated static word banks.')
          payload = text[text.index(prefix) + len(prefix):].strip()
          if payload.endswith(';'):
              payload = payload[:-1]
          data = json.loads(payload)
          assert len(data['Marvel']) == 160
          assert len(data['Marvel (Chinese version)']) == 160
          assert len(data['Disney']) == 106
          assert len(data['Disney (Chinese version)']) == 106
          assert data['Marvel (Chinese version)'][12] == '钢铁侠'
          assert data['Marvel (Chinese version)'][13] == '钢铁侠（无限战争）'
          assert data['Marvel (Chinese version)'][14] == '恶名钢铁侠'
          assert data['Disney (Chinese version)'][0] == '米奇'
          assert data['Disney (Chinese version)'][10] == '灰姑娘'
          assert data['Disney (Chinese version)'][64] == '艾莎'
          for key in ('Marvel (Chinese version)', 'Disney (Chinese version)'):
              assert len(data[key]) == len(set(data[key]))
              assert all(re.search(r'[\u4e00-\u9fff]', x) for x in data[key])
          print('Translated categories validated')
          PY

      - name: Commit final update
        run: |
          rm -f .github/scripts/add_chinese_marvel_disney.py
          rm -f .github/workflows/add-chinese-marvel-disney.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Mainland Chinese Marvel and Disney categories"
          git push
