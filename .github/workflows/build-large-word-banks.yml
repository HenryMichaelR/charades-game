name: Build large word banks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-large-word-banks.yml
      - .github/scripts/build_large_word_banks.py

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: pip install requests beautifulsoup4

      - name: Generate five 500-word banks
        run: python .github/scripts/build_large_word_banks.py

      - name: Validate JavaScript and category counts
        shell: bash
        run: |
          node --check words.js
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          script = text.rsplit('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/charades.js').write_text(script, encoding='utf-8')
          assert '<script src="words.js"></script>' in text
          assert 'const categories = window.CHARADES_CATEGORIES;' in text
          assert 'const categories = {' not in text
          PY
          node --check /tmp/charades.js
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('words.js', 'utf8'), context);
          const banks = context.window.CHARADES_CATEGORIES;
          for (const [name, words] of Object.entries(banks)) {
            if (words.length !== 500) throw new Error(`${name}: ${words.length}`);
            const unique = new Set(words.map(word => word.toLowerCase()));
            if (unique.size !== 500) throw new Error(`${name} has duplicates`);
          }
          console.log(Object.fromEntries(Object.entries(banks).map(([k,v]) => [k,v.length])));
          JS

      - name: Commit expanded word banks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/build_large_word_banks.py
          rm -f .github/workflows/build-large-word-banks.yml
          rm -f .github/scripts/test_large_word_sources.py
          rm -f .github/workflows/test-large-word-sources.yml
          git add -A
          git commit -m "Expand every category to 500 unique prompts"
          git push
