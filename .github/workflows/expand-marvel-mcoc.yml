name: Expand Marvel with recognizable MCOC champions

on:
  push:
    paths:
      - ".github/workflows/expand-marvel-mcoc.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace Marvel word bank
        run: python .github/scripts/expand_marvel_mcoc.py

      - name: Validate word bank
        run: |
          node --check words.js
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          text = Path("words.js").read_text(encoding="utf-8")
          payload = text.split("window.CHARADES_CATEGORIES = ", 1)[1].strip()
          categories = json.loads(payload[:-1])
          marvel = categories["Marvel"]
          normalized = [re.sub(r"[^a-z0-9]+", "", name.casefold()) for name in marvel]

          assert len(marvel) == 155, len(marvel)
          assert len(normalized) == len(set(normalized))

          required = [
              "Spider-Man (Stark Enhanced)",
              "Captain America (Infinity War)",
              "Black Widow (Claire Voyant)",
              "Wolverine (Weapon X)",
              "Cosmic Ghost Rider",
              "Doctor Doom",
              "Hercules",
              "Nimrod",
              "Kushala",
              "Okoye",
              "M'Baku",
              "Silver Sable",
          ]
          for name in required:
              assert name in marvel, name

          forbidden = [
              "Aunt May",
              "Mary Jane",
              "Pepper Potts",
              "Happy Hogan",
              "Peggy Carter",
              "A Friend",
              "A La Mode",
              "Aaron Carpenter",
          ]
          for name in forbidden:
              assert name not in marvel, name

          print("Validated 155 recognizable MCOC champions")
          PY

      - name: Commit final Marvel category
        run: |
          rm -f .github/scripts/expand_marvel_mcoc.py
          rm -f .github/workflows/expand-marvel-mcoc.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand Marvel category with MCOC champions"
          git push
