name: Fix motion angle wrapping

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-angle-wrap.yml
      - .github/scripts/fix_angle_wrap.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply circular angle fix
        run: python .github/scripts/fix_angle_wrap.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          script = text.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/charades.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/charades.js

      - name: Commit angle-wrap fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/fix_angle_wrap.py
          git rm .github/workflows/fix-angle-wrap.yml
          git add index.html
          git commit -m "Reset tilt direction correctly after every word"
          git push
