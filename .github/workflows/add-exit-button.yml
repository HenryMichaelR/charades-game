name: Add exit button

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-exit-button.yml
      - .github/scripts/add_exit_button.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exit button patch
        run: python .github/scripts/add_exit_button.py

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          script = text.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/charades.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/charades.js

      - name: Verify exit feature
        shell: bash
        run: |
          grep -q 'class="exit-game-button"' index.html
          grep -q 'onclick="exitGame()"' index.html
          grep -q 'function exitGame()' index.html
          grep -q 'End this round and view your results?' index.html

      - name: Commit exit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/add_exit_button.py
          git rm .github/workflows/add-exit-button.yml
          git add index.html
          git commit -m "Add exit option during rounds"
          git push
