name: Test large word sources

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-large-word-sources.yml
      - .github/scripts/test_large_word_sources.py

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python .github/scripts/test_large_word_sources.py
