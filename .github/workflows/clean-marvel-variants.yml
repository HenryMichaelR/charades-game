name: Clean Marvel variant names

on:
  push:
    paths:
      - ".github/workflows/clean-marvel-variants.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Clean Marvel names
        run: python .github/scripts/clean_marvel_variants.py

      - name: Validate words.js
        run: node --check words.js

      - name: Commit final cleanup
        run: |
          rm -f .github/scripts/clean_marvel_variants.py
          rm -f .github/workflows/clean-marvel-variants.yml
          rmdir .github/scripts 2>/dev/null || true
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify Marvel character names"
          git push
